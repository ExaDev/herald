[package]
name = "herald"
version = "0.1.0"
edition = "2024"

[dependencies]
jsonschema = { version = "0.60.2", default-features = false }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["sync", "rt", "macros"] }

[dev-dependencies]
async-trait = "0.1.92"
kvm-core = { git = "https://github.com/Mearman/kvm-control", rev = "68034b4b9ebc41adc2cd2ab064895fb3473a4289" }
