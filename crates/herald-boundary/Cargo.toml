[package]
name = "herald-boundary"
version = "0.1.0"
edition = "2024"
description = "Authentication and origin policy at the edge of Herald's network adapters"

[dependencies]
axum = "0.8"
herald = { path = "../.." }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }
