[package]
name = "herald-mcp"
version = "0.1.0"
edition = "2024"
description = "Exposes Herald capabilities over MCP using the official Rust SDK"

[dependencies]
herald = { path = "../.." }
herald-boundary = { path = "../herald-boundary" }
rmcp = { version = "3.9.0", features = ["server", "transport-io", "transport-streamable-http-server"] }
http = "1"
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
jsonschema = { version = "0.60.2", default-features = false }
herald = { path = "../..", features = [] }
rmcp = { version = "3.9.0", features = ["client", "server", "transport-io", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
